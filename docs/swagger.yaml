basePath: /
host: localhost:8080
info:
  contact:
    email: your-email@example.com
    name: API Support
    url: https://github.com/heavydash/my-url-shortenergo/issues
  description: Сервис сокращения URL с поддержкой различных хранилищ, аудита и graceful
    shutdown.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/heavydash/my-url-shortenergo
  title: URL Shortener API
  version: "1.0"
paths:
  /ping:
    get:
      consumes:
      - application/json
      description: Возвращает статус "ok", если сервер запущен и готов принимать запросы
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка работоспособности сервиса
      tags:
      - health
securityDefinitions:
  ApiKeyAuth:
    description: Cookie-based authorization
    in: cookie
    name: token
    type: apiKey
swagger: "2.0"
